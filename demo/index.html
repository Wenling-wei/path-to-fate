<title>剩下的牌</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --paper: #f3efe6; --card: #fbf9f4; --ink: #22201c; --mute: #7a746a; --rule: #d9d2c3;
  --red: #a8322b; --amber: #9a6a14; --green: #2f6b4f; --blue: #2c4f7c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.55 "Noto Serif SC", "Songti SC", "SimSun", "PingFang SC", "Microsoft YaHei", serif; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }

.btn { border: 1px solid var(--ink); background: transparent; padding: 6px 12px; border-radius: 3px; display: inline-flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; }
.btn small { font-size: 11px; color: var(--mute); }
.btn:hover { background: var(--ink); color: var(--paper); }
.btn:hover small { color: var(--rule); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.primary small { color: var(--rule); }
.btn.primary:hover { background: var(--red); border-color: var(--red); }
.btn.danger { border-color: var(--red); background: var(--red); color: #fff; }
.btn.cut { padding: 1px 8px; font-size: 12px; border-color: var(--red); color: var(--red); }
.btn.cut:hover { background: var(--red); color: #fff; }
.btn.discard { width: 100%; margin-top: 6px; border-color: var(--rule); padding: 4px 8px; }

/* 选出身 */
.pick { max-width: 980px; margin: 0 auto; padding-block: 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pick h1 { font-size: 44px; letter-spacing: 6px; }
.lead { margin: 12px 0 28px; font-size: 16px; color: var(--mute); max-width: 620px; }
.lead b { color: var(--red); }
.origins { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.origin { background: var(--card); border: 1px solid var(--rule); border-top: 4px solid var(--ink); padding: 18px; text-align: left; display: flex; flex-direction: column; gap: 8px; border-radius: 3px; }
.origin:hover { border-top-color: var(--red); transform: translateY(-2px); transition: transform .15s; }
.origin .taste { color: var(--red); }
.origin .nums, .origin .hand { font-size: 12px; color: var(--mute); }
.k { display: inline-block; font-size: 11px; border: 1px solid var(--rule); padding: 0 5px; margin-right: 6px; color: var(--mute); }
.hard { display: block; margin-top: 20px; color: var(--mute); }

/* 牌桌 */
.table { padding-block: 12px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1500px; margin: 0 auto; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 10px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--paper); z-index: 5; }
.title h1 { font-size: 22px; letter-spacing: 3px; }
.title span { color: var(--mute); font-size: 13px; }
.res { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.r { display: flex; flex-direction: column; font-size: 11px; color: var(--mute); min-width: 44px; }
.r b { font-size: 20px; color: var(--ink); line-height: 1.1; font-variant-numeric: tabular-nums; }
.r i { font-style: normal; font-size: 10px; }
.r.warn b { color: var(--red); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; margin-top: 12px; }
@media (max-width: 900px) { .main { grid-template-columns: 1fr; } }

.eras { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.era { flex: 1 1 280px; background: var(--ink); color: var(--paper); padding: 8px 12px; border-radius: 3px; display: flex; flex-direction: column; }
.era span { color: var(--rule); font-size: 13px; }
.era em { font-style: normal; font-size: 12px; color: #e3c98a; }
.era.ai { background: var(--red); }
.era.ai em { color: #ffe1c4; }

.flash { padding: 10px 14px; margin-bottom: 10px; border-left: 4px solid var(--green); background: #e6efe7; display: flex; flex-wrap: wrap; gap: 4px 14px; animation: pop .45s ease-out; border-radius: 3px; }
.flash b { width: 100%; font-size: 16px; color: var(--green); }
.flash.cut { border-color: var(--red); background: #f3e2df; }
.flash.cut b { color: var(--red); }
@keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }

.offer { border: 2px dashed var(--ink); padding: 12px; margin-bottom: 12px; border-radius: 3px; background: #efe9da; }
.offer-label { font-size: 12px; color: var(--mute); margin-bottom: 8px; letter-spacing: 1px; }
.offer-body { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.offer-body .card { width: 260px; }
.offer-btns { display: flex; flex-direction: column; gap: 8px; min-width: 140px; }
.pickable { text-align: left; }
.pickable:hover { border-color: var(--red); }

.lines { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; align-items: start; }
.line { border-top: 2px solid var(--ink); padding-top: 6px; display: flex; flex-direction: column; gap: 8px; }
.line-head { display: flex; justify-content: space-between; align-items: center; }
.line-head h3 { font-size: 15px; letter-spacing: 2px; }
.nocut { font-size: 11px; color: var(--mute); }
.empty { color: var(--rule); border: 1px dashed var(--rule); padding: 14px; text-align: center; border-radius: 3px; }
.cut-confirm { border: 1px solid var(--red); background: #f3e2df; padding: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 6px; border-radius: 3px; }

.card { background: var(--card); border: 1px solid var(--rule); border-left: 3px solid var(--blue); padding: 8px 10px; border-radius: 3px; display: flex; flex-direction: column; gap: 3px; }
.card.bad { border-left-color: var(--red); background: #f8ecea; }
.card.locked { border-left-color: var(--mute); }
.card.withered { opacity: .55; border-left-color: var(--rule); border-style: dashed; }
.card.offered { border-left-color: var(--amber); }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.name { font-weight: 700; font-size: 15px; margin-right: 2px; }
.badge { font-size: 10px; padding: 0 5px; border-radius: 2px; border: 1px solid currentColor; }
.badge.red { color: var(--red); } .badge.amber { color: var(--amber); } .badge.dim { color: var(--mute); }
.stats { font-size: 12px; font-variant-numeric: tabular-nums; }
.era-note { font-size: 11px; color: var(--amber); }
.from, .grows { font-size: 11px; color: var(--mute); }
.grows { color: var(--green); }
.grows.closed { color: var(--mute); }
.flavor { font-size: 12px; color: var(--mute); font-style: italic; }

.actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--rule); color: var(--mute); flex-wrap: wrap; }

.log { border-left: 1px solid var(--rule); padding-left: 14px; max-height: calc(100vh - 110px); overflow-y: auto; position: sticky; top: 90px; }
.log h3 { font-size: 13px; letter-spacing: 2px; margin-bottom: 6px; }
.log p { font-size: 12px; padding: 4px 0; border-bottom: 1px dotted var(--rule); }
.log i { font-style: normal; color: var(--mute); margin-right: 6px; font-size: 11px; }
.log .l-era { font-weight: 700; } .log .l-bad { color: var(--red); } .log .l-good { color: var(--green); } .log .l-gossip { color: var(--amber); }

/* 结算 */
.end { max-width: 900px; margin: 0 auto; padding-block: 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.end .sub { color: var(--mute); }
.end h1 { font-size: 40px; margin: 6px 0; color: var(--red); }
.blurb { font-size: 17px; }
.tags { color: var(--mute); margin-top: 6px; }
.end-body { display: grid; grid-template-columns: 320px 1fr; gap: 24px; margin-top: 24px; align-items: start; }
@media (max-width: 760px) { .end-body { grid-template-columns: 1fr; } }
.radar { width: 100%; overflow: visible; }
.radar .grid { fill: none; stroke: var(--rule); }
.radar .shape { fill: rgba(168, 50, 43, .25); stroke: var(--red); stroke-width: 2; }
.radar text { font-size: 11px; fill: var(--ink); }
.recap { display: flex; flex-direction: column; gap: 10px; }
.recap h3 { font-size: 13px; letter-spacing: 2px; border-bottom: 1px solid var(--ink); padding-bottom: 2px; }
.diag { font-size: 16px; }
.recap ul { margin: 0; padding-left: 18px; }
.final { color: var(--mute); }
.recap .btn { align-self: flex-start; margin-top: 8px; }

.r.kid b { color: var(--green); }

.era.abroad { background: var(--blue); }
.era.abroad em { color: #d6e4f5; }
.cut-confirm.emi { margin-top: 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:disabled:hover { background: transparent; color: var(--red); }
.actions .btn.cut { padding: 6px 12px; font-size: 14px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.lines, .line, .card { min-width: 0; }
@media (max-width: 900px) { .log { position: static; max-height: 320px; border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 10px; } header { position: static; } .pick h1 { font-size: 34px; } .end h1 { font-size: 30px; } .offer-body .card { width: 100%; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } .origin:hover { transform: none; } }

</style>
